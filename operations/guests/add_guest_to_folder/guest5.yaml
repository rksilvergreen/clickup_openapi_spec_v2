title: Guest5
required:
  - user
  - invited_by
  - can_see_time_spent
  - can_see_time_estimated
  - can_edit_tags
  - shared
type: object
properties:
  user:
    $ref: "../../../shared/user7.yaml"
  invited_by:
    $ref: "../../../shared/invited_by.yaml"
  can_see_time_spent:
    type: boolean
  can_see_time_estimated:
    type: boolean
  can_edit_tags:
    type: boolean
  shared:
    title: Shared5
    required:
      - tasks
      - lists
      - folders
    type: object
    properties:
      tasks:
        type: array
        items:
          type: string
        description: ""
      lists:
        type: array
        items:
          type: string
        description: ""
      folders:
        type: array
        items:
          title: Folder4
          required:
            - id
            - name
            - orderindex
            - override_statuses
            - hidden
            - task_count
            - archived
            - statuses
            - lists
            - permission_level
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            orderindex:
              type: integer
              contentEncoding: int32
            override_statuses:
              type: boolean
            hidden:
              type: boolean
            task_count:
              type: string
            archived:
              type: boolean
            statuses:
              type: array
              items:
                $ref: "../../../shared/status.yaml"
              description: ""
            lists:
              type: array
              items:
                type: string
              description: ""
            permission_level:
              type: string
          examples:
            -
              id: "1057"
              name: "Folder Name"
              orderindex: 5
              override_statuses: true
              hidden: false
              task_count: "20"
              archived: false
              statuses:
                -
                  status: Open
                  orderindex: 0
                  color: "#d3d3d3"
                  type: open
                -
                  status: Closed
                  orderindex: 5
                  color: "#6bc950"
                  type: closed
              lists:
                []
              permission_level: read
        description: ""
    examples:
      -
        tasks:
          []
        lists:
          []
        folders:
          -
            id: "1057"
            name: "Folder Name"
            orderindex: 5
            override_statuses: true
            hidden: false
            task_count: "20"
            archived: false
            statuses:
              -
                status: Open
                orderindex: 0
                color: "#d3d3d3"
                type: open
              -
                status: Closed
                orderindex: 5
                color: "#6bc950"
                type: closed
            lists:
              []
            permission_level: read
