title: Team1
required:
  - id
  - name
  - color
  - avatar
  - members
  - roles
type: object
properties:
  id:
    type: string
  name:
    type: string
  color:
    type: string
  avatar:
    type:
      - string
      - null
  members:
    type: array
    items:
      title: Member4
      required:
        - user
        - invited_by
        - can_see_time_spent
        - can_see_time_estimated
        - can_edit_tags
        - can_create_views
      type: object
      properties:
        user:
          $ref: "../../../shared/user5.yaml"
        invited_by:
          $ref: "../../../shared/invited_by.yaml"
        can_see_time_spent:
          type: boolean
        can_see_time_estimated:
          type: boolean
        can_edit_tags:
          type: boolean
        can_create_views:
          type: boolean
        can_see_points_estimated:
          type: boolean
      examples:
        -
          user:
            id: 184
            username: null
            email: "guest@example.com"
            color: null
            profilePicture: null
            initials: G
            role: 4
            custom_role:
              id: 12345
              name: "guest custom"
            last_active: null
            date_joined: null
            date_invited: "1583358383412"
          invited_by:
            id: 183
            color: "#827718"
            username: Jerry
            email: "jerry@example.com"
            initials: J
            profilePicture: https://attachments.clickup.com/profilePictures/profile.jpg
          can_see_time_spent: true
          can_see_time_estimated: true
          can_edit_tags: true
          can_create_views: true
          can_see_points_estimated: true
    description: ""
  roles:
    type: array
    items:
      $ref: "../../../shared/role.yaml"
    description: ""
examples:
  -
    id: "333"
    name: "Team Name"
    color: "#8D00D4"
    avatar: null
    members:
      -
        user:
          id: 184
          username: null
          email: "guest@example.com"
          color: null
          profilePicture: null
          initials: G
          role: 4
          custom_role:
            id: 12345
            name: "guest custom"
          last_active: null
          date_joined: null
          date_invited: "1583358383412"
        invited_by:
          id: 183
          color: "#827718"
          username: Jerry
          email: "jerry@example.com"
          initials: J
          profilePicture: https://attachments.clickup.com/profilePictures/profile.jpg
        can_see_time_spent: true
        can_see_time_estimated: true
        can_see_points_estimated: true
        can_edit_tags: true
        can_create_views: true
