description: "You can subscribe to specific events, and one specific location per webhook. [Learn more](doc:webhooks)."
content:
  application/json:
    schema:
      title: CreateWebhookRequest
      required:
        - endpoint
        - events
      type: object
      properties:
        endpoint:
          type: string
        events:
          type: array
          description: "See [documentation](doc:webhooks#task-webhooks) for available event options. Use `*` to subscribe to all events."
          items:
            type: string
        space_id:
          type: integer
        folder_id:
          type: integer
        list_id:
          type: integer
        task_id:
          type: string
      examples:
        -
          endpoint: https://yourdomain.com/webhook
          events:
            - taskCreated
            - taskUpdated
            - taskDeleted
            - taskPriorityUpdated
            - taskStatusUpdated
            - taskAssigneeUpdated
            - taskDueDateUpdated
            - taskTagUpdated
            - taskMoved
            - taskCommentPosted
            - taskCommentUpdated
            - taskTimeEstimateUpdated
            - taskTimeTrackedUpdated
            - listCreated
            - listUpdated
            - listDeleted
            - folderCreated
            - folderUpdated
            - folderDeleted
            - spaceCreated
            - spaceUpdated
            - spaceDeleted
            - goalCreated
            - goalUpdated
            - goalDeleted
            - keyResultCreated
            - keyResultUpdated
            - keyResultDeleted
          space_id: 1234
          folder_id: 5678
          list_id: 9876
          task_id: abc1234
required: true
