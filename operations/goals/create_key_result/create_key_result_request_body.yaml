          type: string
        steps_start:
          type: integer
          contentEncoding: int32
        steps_end:
          type: integer
          contentEncoding: int32
        unit:
          type: string
        task_ids:
          description: "Enter an array of task IDs to link this target with one or more tasks."
          type: array
          items:
            type: string
        list_ids:
          type: array
          items:
            type: string
          description: "Enter an array of List IDs to link this target with one or more Lists."
      examples:
        -
          name: "New Target Name"
          owners:
            - 183
          type: number
          steps_start: 0
          steps_end: 10
          unit: km
          task_ids:
            []
          list_ids:
            []
