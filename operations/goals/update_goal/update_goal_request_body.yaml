description: ""
content:
  application/json:
    schema:
      title: UpdateGoalRequest
      required:
        - name
        - due_date
        - description
        - rem_owners
        - add_owners
        - color
      type: object
      properties:
        name:
          type: string
        due_date:
          type: integer
          contentEncoding: int64
        description:
          type: string
        rem_owners:
          type: array
          items:
            type: integer
            contentEncoding: int32
          description: "Array of user IDs."
        add_owners:
          type: array
          items:
            type: integer
            contentEncoding: int32
          description: "Array of user IDs."
        color:
          type: string
      examples:
        -
          name: "Updated Goal Name"
          due_date: 1568036964079
          description: "Updated Goal Description"
          rem_owners:
            - 183
          add_owners:
            - 184
          color: "#32a852"
required: true
