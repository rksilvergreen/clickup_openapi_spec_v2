type: object
description: ""
title: Datum2
required:
  - id
  - wid
  - user
  - billable
  - start
  - end
  - duration
  - description
  - tags
  - source
  - at
  - task_location
  - task_tags
  - task_url
properties:
  id:
    type: string
  wid:
    type: string
  user:
    $ref: "../../../shared/user2.yaml"
  billable:
    type: boolean
  start:
    type: string
  end:
    type: string
  duration:
    type: string
  description:
    type: string
  tags:
    type: array
    items:
      type: string
    description: ""
  source:
    type: string
  at:
    type: string
  approval_id:
    type: string
    description: "ID of the associated approval"
  approval:
    $ref: "../../../shared/approval.yaml"
  task_location:
    title: TaskLocation
    required:
      - list_id
      - folder_id
      - space_id
      - list_name
      - folder_name
      - space_name
    type: object
    properties:
      list_id:
        type: integer
        contentEncoding: int32
      folder_id:
        type: integer
        contentEncoding: int32
      space_id:
        type: integer
        contentEncoding: int32
      list_name:
        type: string
      folder_name:
        type: string
      space_name:
        type: string
    examples:
      -
        list_id: 1560300071
        folder_id: 468300080
        space_id: 22800253
        list_name: List
        folder_name: Folder
        space_name: Space
  task_tags:
    type: array
    items:
      title: TaskTag
      required:
        - name
        - tag_fg
        - tag_bg
        - creator
      type: object
      properties:
        name:
          type: string
        tag_fg:
          type: string
        tag_bg:
          type: string
        creator:
          type: integer
          contentEncoding: int32
      examples:
        -
          name: content-request
          tag_fg: "#800000"
          tag_bg: "#2ecd6f"
          creator: 301828
    description: ""
  task_url:
    type: string
examples:
  -
    id: timer_id
    wid: workspace_id
    user:
