get:
  summary: Get Webhooks
  tags:
    - Webhooks
  description: View the webhooks created via the API for a Workspace. This endpoint returns webhooks created by the authenticated user.
  operationId: GetWebhooks
  parameters:
    -
      $ref: "../operations/webhooks/get_webhooks/get_webhooks_parameterteam_id_path.yaml"
  responses:
    200:
      $ref: "../operations/webhooks/get_webhooks/get_webhooks_response_200.yaml"
  deprecated: false
post:
  summary: Create Webhook
  tags:
    - Webhooks
  description: Set up a webhook to monitor for events.<br> We do not have a dedicated IP address for webhooks. We use our domain name and dynamic addressing.
  operationId: CreateWebhook
  parameters:
    -
      $ref: "../operations/webhooks/create_webhook/create_webhook_parameterteam_id_path.yaml"
  requestBody:
    $ref: "../operations/webhooks/create_webhook/create_webhook_request_body.yaml"
  responses:
    200:
      $ref: "../operations/webhooks/create_webhook/create_webhook_response_200.yaml"
  deprecated: false
