    -
      $ref: "../operations/comments/get_chat_view_comments/get_chat_view_comments_parameterstart_id_query.yaml"
  responses:
    200:
      $ref: "../operations/comments/get_chat_view_comments/get_chat_view_comments_response_200.yaml"
  deprecated: false
