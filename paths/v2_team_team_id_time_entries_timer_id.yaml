      $ref: "../operations/time_tracking/update_time_entry/update_time_entry_parameterteam_id_query.yaml"
  requestBody:
    $ref: "../operations/time_tracking/update_time_entry/update_time_entry_request_body.yaml"
  responses:
    200:
      $ref: "../operations/time_tracking/update_time_entry/update_time_entry_response_200.yaml"
  deprecated: false
delete:
  summary: Delete a time Entry
  tags:
    - Time Tracking
  description: Delete a time entry from a Workspace.
  operationId: DeleteTimeEntry
  parameters:
    - $ref: "../operations/time_tracking/delete_time_entry/delete_time_entry_parameterteam_id_path.yaml"
    - $ref: "../operations/time_tracking/delete_time_entry/delete_time_entry_parametertimer_id_path.yaml"
    -
      $ref: "../operations/time_tracking/delete_time_entry/delete_time_entry_parametercontent_type_header.yaml"
  responses:
