  summary: Update a time Entry
  tags:
    - Time Tracking
  description: Update the details of a time entry.
  operationId: UpdateTimeEntry
  parameters:
    - $ref: "../operations/time_tracking/update_time_entry/update_time_entry_parameterteam_id_path.yaml"
    - $ref: "../operations/time_tracking/update_time_entry/update_time_entry_parametertimer_id_path.yaml"
    - $ref: "../operations/time_tracking/update_time_entry/update_time_entry_parametercustom_task_ids_query.yaml"
