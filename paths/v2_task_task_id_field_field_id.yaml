post:
  summary: Set Custom Field Value
  description: "Add data to a Custom field on a task. \\\n \\\nYou'll need to know the `task_id` of the task you want to update, and the universal unique identifier (UUID) `field_id` of the Custom Field you want to set. \\\n \\\nYou can use [Get Accessible Custom Fields](ref:getaccessiblecustomfields) or the [Get Task](ref:gettask) endpoint to find the `field_id`."
  tags:
    - Custom Fields
  operationId: SetCustomFieldValue
  parameters:
    - $ref: "../operations/custom_fields/set_custom_field_value/set_custom_field_value_parametertask_id_path.yaml"
    - $ref: "../operations/custom_fields/set_custom_field_value/set_custom_field_value_parameterfield_id_path.yaml"
    - $ref: "../operations/custom_fields/set_custom_field_value/set_custom_field_value_parametercustom_task_ids_query.yaml"
    -
      $ref: "../operations/custom_fields/set_custom_field_value/set_custom_field_value_parameterteam_id_query.yaml"
  requestBody:
    $ref: "../operations/custom_fields/set_custom_field_value/set_custom_field_value_request_body.yaml"
  responses:
    200:
      $ref: "../operations/custom_fields/set_custom_field_value/set_custom_field_value_response_200.yaml"
  deprecated: false
delete:
  summary: Remove Custom Field Value
  tags:
    - Custom Fields
  description: Remove the data from a Custom Field on a task. This does not delete the option from the Custom Field.
  operationId: RemoveCustomFieldValue
  parameters:
    - $ref: "../operations/custom_fields/remove_custom_field_value/remove_custom_field_value_parametertask_id_path.yaml"
    - $ref: "../operations/custom_fields/remove_custom_field_value/remove_custom_field_value_parameterfield_id_path.yaml"
    - $ref: "../operations/custom_fields/remove_custom_field_value/remove_custom_field_value_parametercustom_task_ids_query.yaml"
    -
      $ref: "../operations/custom_fields/remove_custom_field_value/remove_custom_field_value_parameterteam_id_query.yaml"
  responses:
    200:
      $ref: "../operations/custom_fields/remove_custom_field_value/remove_custom_field_value_response_200.yaml"
  deprecated: false
