      $ref: "../operations/lists/remove_task_from_list/remove_task_from_list_parametertask_id_path.yaml"
  responses:
    200:
      $ref: "../operations/lists/remove_task_from_list/remove_task_from_list_response_200.yaml"
  deprecated: false
