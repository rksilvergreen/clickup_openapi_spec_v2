  tags:
    - Task Relationships
  description: Set a task as waiting on or blocking another task.
  operationId: AddDependency
  parameters:
    - $ref: "../operations/task_relationships/add_dependency/add_dependency_parametertask_id_path.yaml"
    - $ref: "../operations/task_relationships/add_dependency/add_dependency_parametercustom_task_ids_query.yaml"
    -
      $ref: "../operations/task_relationships/add_dependency/add_dependency_parameterteam_id_query.yaml"
