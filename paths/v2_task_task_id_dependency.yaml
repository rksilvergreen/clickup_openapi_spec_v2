    - $ref: "../operations/task_relationships/delete_dependency/delete_dependency_parameterdepends_on_query.yaml"
    - $ref: "../operations/task_relationships/delete_dependency/delete_dependency_parameterdependency_of_query.yaml"
    - $ref: "../operations/task_relationships/delete_dependency/delete_dependency_parametercustom_task_ids_query.yaml"
