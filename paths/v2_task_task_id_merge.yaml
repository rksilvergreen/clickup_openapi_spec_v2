post:
  summary: Merge Tasks
  description: Merge multiple tasks into a target task. The target task is specified by the task_id parameter, while the source tasks to be merged are provided in the request body. Custom Task IDs are not supported.
  tags:
    - Tasks
  operationId: mergeTasks
  parameters:
    -
      $ref: "../operations/tasks/merge_tasks/merge_tasks_parametertask_id_path.yaml"
  requestBody:
    $ref: "../operations/tasks/merge_tasks/merge_tasks_request_body.yaml"
  responses:
    200:
      $ref: "../operations/tasks/merge_tasks/merge_tasks_response_200.yaml"
    400:
      $ref: "../operations/tasks/merge_tasks/merge_tasks_response_400.yaml"
    403:
      $ref: "../operations/tasks/merge_tasks/merge_tasks_response_403.yaml"
    404:
      $ref: "../operations/tasks/merge_tasks/merge_tasks_response_404.yaml"
