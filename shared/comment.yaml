title: Comment
required:
  - id
  - comment
  - comment_text
  - user
  - resolved
  - assignee
  - assigned_by
  - reactions
  - date
type: object
properties:
  id:
    type: string
  comment:
    type: array
    items:
      title: Comment1
      required:
        - text
      type: object
      properties:
        text:
          type: string
      examples:
        -
          text: "Task comment content"
    description: ""
  comment_text:
    type: string
  user:
    $ref: "./user2.yaml"
  resolved:
    type: boolean
  assignee:
    title: Assignee
    required:
      - id
      - username
      - email
      - color
      - initials
      - profilePicture
    type: object
    properties:
      id:
        type: integer
        contentEncoding: int32
      username:
        type: string
      email:
        type: string
      color:
        type: string
      initials:
        type: string
      profilePicture:
        type: string
    examples:
      -
        id: 183
        username: "John Doe"
        email: "example@email.com"
        color: "#827718"
        initials: JD
        profilePicture: https://attachments.clickup.com/profilePictures/183_nx1.jpg
  assigned_by:
    title: AssignedBy
    required:
      - id
      - username
      - initials
      - email
      - color
      - profilePicture
    type: object
    properties:
      id:
        type: integer
        contentEncoding: int32
      username:
        type: string
      initials:
        type: string
      email:
        type: string
      color:
        type: string
      profilePicture:
        type: string
    examples:
      -
        id: 183
        username: "John Doe"
        initials: JD
        email: "johndoe@gmail.com"
        color: "#827718"
        profilePicture: https://attachments-public.clickup.com/profilePictures/183_abc.jpg
  reactions:
    type: array
    items:
      type: string
    description: ""
  date:
    type: string
  reply_count:
    type: string
    description: "For threaded comments, `reply_count` is always 0."
examples:
  -
    id: "458"
    comment:
      -
        text: "Task comment content"
    comment_text: "Task comment content"
    user:
      id: 183
      username: "John Doe"
      initials: JD
      email: "johndoe@gmail.com"
      color: "#827718"
      profilePicture: https://attachments-public.clickup.com/profilePictures/183_abc.jpg
    resolved: false
    assignee:
      id: 183
      username: "John Doe"
      initials: JD
      email: "johndoe@gmail.com"
      color: "#827718"
      profilePicture: https://attachments-public.clickup.com/profilePictures/183_abc.jpg
    assigned_by:
      id: 183
      username: "John Doe"
      initials: JD
      email: "johndoe@gmail.com"
      color: "#827718"
      profilePicture: https://attachments-public.clickup.com/profilePictures/183_abc.jpg
    reactions:
      []
    date: "1568036964079"
    reply_count: "1"
