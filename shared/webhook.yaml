title: Webhook
required:
  - id
  - userid
  - team_id
  - endpoint
  - client_id
  - events
  - task_id
  - list_id
  - folder_id
  - space_id
  - health
  - secret
type: object
properties:
  id:
    type: string
  userid:
    type: integer
    contentEncoding: int32
  team_id:
    type: integer
    contentEncoding: int32
  endpoint:
    type: string
  client_id:
    type: string
  events:
    type: array
    items:
      type: string
    description: ""
  task_id:
    type:
      - string
      - null
  list_id:
    type:
      - string
      - null
  folder_id:
    type:
      - string
      - null
  space_id:
    type:
      - string
      - null
  health:
    title: Health
    required:
      - status
      - fail_count
    type: object
    properties:
      status:
        type: string
      fail_count:
        type: integer
        contentEncoding: int32
    examples:
      -
        status: active
        fail_count: 0
  secret:
    type: string
