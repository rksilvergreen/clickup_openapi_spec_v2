title: User
type: object
properties:
  id:
    type: integer
    contentEncoding: int32
  username:
    type: string
  email:
    type: string
  color:
    type: string
  profilePicture:
    type: string
  initials:
    type: string
  week_start_day:
    type: integer
    contentEncoding: int32
    description: "The user's preferred start of the calendar week setting. \\ `0` is Sunday. \\ `1` is Monday."
  global_font_support:
    type: boolean
  timezeone:
    type: string
examples:
  -
    id: 123
    username: "John Doe"
    email: "user@company.com"
    color: "#000000"
    profilePicture: https://clickup.com/avatar.jpg
    initials: JD
    week_start_day: 0
    global_font_support: false
    timezone: America/Los_Angeles
