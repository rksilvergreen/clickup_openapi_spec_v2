title: Data3
required:
  - id
  - task
  - wid
  - user
  - billable
  - start
  - end
  - duration
  - description
  - tags
  - source
  - at
type: object
properties:
  id:
    type: string
  task:
    title: Task6
    required:
      - id
      - name
      - status
      - custom_type
    type: object
    properties:
      id:
        type: string
      name:
        type: string
      status:
        $ref: "./status.yaml"
      custom_type:
        type:
          - string
          - null
    examples:
      -
        id: task_id
        name: "test task"
        status:
          status: "to do"
          color: "#d3d3d3"
          type: open
          orderindex: 0
        custom_type: null
  wid:
    type: string
  user:
    title: User2
    required:
      - id
      - username
      - initials
      - email
      - color
      - profilePicture
    type: object
    properties:
      id:
        type: integer
        contentEncoding: int32
      username:
        type: string
      initials:
        type: string
      email:
        type: string
      color:
        type: string
      profilePicture:
        type: string
    examples:
      -
        id: 183
        username: "John Doe"
        initials: JD
        email: "johndoe@gmail.com"
        color: "#827718"
        profilePicture: https://attachments-public.clickup.com/profilePictures/183_abc.jpg
  billable:
    type: boolean
  start:
    type: string
  end:
    type: integer
    contentEncoding: int64
  duration:
    type: integer
    contentEncoding: int32
  description:
    type: string
  tags:
    type: array
    items:
      type: string
    description: ""
  source:
    type: string
  at:
    type: integer
    contentEncoding: int64
examples:
  -
    id: timer_id
    task:
      id: task_id
      name: "test task"
      status:
        status: "to do"
        color: "#d3d3d3"
