title: Assignee
required:
  - id
  - username
  - email
  - color
  - initials
  - profilePicture
type: object
properties:
  id:
    type: integer
    contentEncoding: int32
  username:
    type: string
  email:
    type: string
  color:
    type: string
  initials:
    type: string
  profilePicture:
    type: string
examples:
  -
    id: 183
    username: "John Doe"
    email: "example@email.com"
    color: "#827718"
    initials: JD
    profilePicture: https://attachments.clickup.com/profilePictures/183_nx1.jpg
